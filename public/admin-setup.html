<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial administrator setup</title><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1ec;color:#292323;font:14px Urbanist,sans-serif;padding:24px}.panel{width:min(100%,420px);background:white;padding:30px;border-radius:16px}h1{font-size:25px;margin:0 0 8px}p{color:#756e69;line-height:1.55}.field{display:block;margin:15px 0}.field span{display:block;font-weight:700;font-size:12px;margin-bottom:7px}.field input{width:100%;height:45px;border:1px solid #d8d2cb;border-radius:9px;padding:0 12px;font:inherit}.btn{width:100%;height:46px;border:0;border-radius:99px;background:#282020;color:white;font:700 13px Urbanist;cursor:pointer;margin-top:10px}.muted{font-size:12px}.error{min-height:20px;color:#a22;font-size:12px}a{color:#624052}</style></head><body><main class="panel"><h1>Set up the first administrator</h1><p>Register the first administrator account with the email and password you want to use. After email confirmation, the platform owner securely assigns the administrator role to that exact account.</p><form id="form"><label class="field"><span>Administrator name</span><input id="name" required maxlength="80" autocomplete="name"></label><label class="field"><span>Email address</span><input id="email" type="email" required autocomplete="email"></label><label class="field"><span>Password</span><input id="password" type="password" required minlength="8" autocomplete="new-password"></label><div class="error" id="error"></div><button class="btn" id="submit">Create first administrator</button></form><p class="muted">Already an administrator? <a href="/admin.html">Sign in</a></p></main><script src="/supabase-client.js"></script><script>
const form=document.getElementById('form'),error=document.getElementById('error'),submit=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;try{const client=await window.creatorSupabaseReady;const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error:signupError}=await client.auth.signUp({email,password,options:{data:{display_name:name,account_type:'admin'},emailRedirectTo:location.origin+'/admin.html'}});if(signupError)throw signupError;if(!data.session){error.textContent='Your administrator account has been created. Check your email to confirm it. The initial admin role will be securely assigned to this account by the platform owner after confirmation.';return;}error.textContent='Your account is created. The platform owner must securely grant the initial administrator role before you can open the Admin Panel.';form.reset();}catch(err){error.textContent=err.message||'Could not create administrator account.';}finally{submit.disabled=false;}});
</script></body></html>
