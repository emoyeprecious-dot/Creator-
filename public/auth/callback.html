<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm account · Artistic</title><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:#171717;font:14px Urbanist,Arial,sans-serif}.panel{width:min(440px,calc(100% - 32px));padding:28px;border:1px solid #e8e8e5;background:#fff}h1{font-size:22px;font-weight:600;margin:0 0 10px}p{font-size:12px;line-height:1.7;color:#777}a{color:#171717}</style><script src="/supabase-client.js" defer></script></head><body><main class="panel"><h1 id="title">Confirming your account</h1><p id="status">Please wait while we securely verify your email link.</p><p id="action"></p></main><script>
(async function(){
 const title=document.getElementById('title'),status=document.getElementById('status'),action=document.getElementById('action');
 const realm=new URLSearchParams(location.search).get('realm')||'viewer';
 if(!['admin','creator','viewer'].includes(realm)){title.textContent='Invalid confirmation link';status.textContent='This account link is not recognized.';return;}
 const params=new URLSearchParams(location.hash.replace(/^#/,''));
 const errorText=params.get('error_description')||new URLSearchParams(location.search).get('error_description');
 if(errorText){title.textContent='Link could not be verified';status.textContent=errorText;return;}
 try{
  const client=await window.creatorSupabaseReady;
  const {data:{session},error}=await client.auth.getSession();if(error)throw error;
  if(!session?.user)throw new Error('This confirmation link may have expired or already been used. Request a new link and try again.');
  const user=session.user;
  if(params.get('type')==='recovery'){
   location.replace(realm==='admin'?'/admin.html?mode=new-password':'/creator-signup.html?mode=new-password');return;
  }
  if(realm==='admin'){
   const {data:role,error:roleError}=await client.from('admin_roles').select('role').eq('user_id',user.id).maybeSingle();if(roleError)throw roleError;
   if(!role){await client.auth.signOut();title.textContent='Registration received';status.textContent='Your email is confirmed. Administrator access is still pending secure authorization by the platform owner.';action.innerHTML='<a href="/admin.html">Return to administrator sign in</a>';return;}
   location.replace('/admin.html');return;
  }
  const expected=realm==='creator'?'creator':'viewer';
  const {data:profile,error:profileError}=await client.from('profiles').select('account_type,display_name').eq('id',user.id).maybeSingle();if(profileError)throw profileError;
  if(profile&&profile.account_type!==expected){await client.auth.signOut();throw new Error('This email is already assigned to a different account area. Use that account’s sign-in page.');}
  const displayName=user.user_metadata?.display_name||profile?.display_name||user.email.split('@')[0];
  if(!profile){const {error:insertError}=await client.from('profiles').insert({id:user.id,email:user.email,display_name:displayName,account_type:expected});if(insertError)throw insertError;}
  if(realm==='creator'){
   let {data:creator,error:creatorError}=await client.from('creator_profiles').select('slug,display_name').eq('user_id',user.id).maybeSingle();if(creatorError)throw creatorError;
   if(!creator?.slug){
    const base=String(user.user_metadata?.creator_slug||displayName).toLowerCase().normalize('NFKD').replace(/[^a-z0-9.-]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'creator';let slug=base,n=1;
    while(true){const {data:exists,error:checkError}=await client.from('creator_profiles').select('user_id').eq('slug',slug).neq('user_id',user.id).maybeSingle();if(checkError)throw checkError;if(!exists)break;slug=base+'-'+(++n);}
    const {error:saveError}=await client.from('creator_profiles').upsert({user_id:user.id,display_name:displayName,slug});if(saveError)throw saveError;creator={slug};
   }
   location.replace('/creator-studio.html?creator='+encodeURIComponent(creator.slug));return;
  }
  const old=JSON.parse(localStorage.getItem('frameform_audience_account_v1')||'{}');
  localStorage.setItem('frameform_audience_account_v1',JSON.stringify({name:displayName,email:user.email,createdAt:old.createdAt||new Date().toISOString(),followedCreators:old.followedCreators||[],userId:user.id}));
  location.replace('/');
 }catch(error){console.error('[Auth callback]',error);title.textContent='Confirmation could not be completed';status.textContent=error.message||'The link is invalid or expired.';action.innerHTML='<a href="'+(realm==='admin'?'/admin.html':realm==='creator'?'/creator-signup.html':'/')+'">Return to sign in</a>';}
})();
</script></body></html>
